[package]
name = "lsi"
version = "1.2.0"
edition = "2021"
description = "An interactive eza-like terminal file explorer with Nerd Fonts and themes"

[features]
default = ["syntax-highlight", "image-preview"]
syntax-highlight = ["dep:syntect"]
image-preview = ["dep:ratatui-image", "dep:image"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2.191"
lru = "0.18.3"
open = "5.4.5"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.8.23"
unicode-width = "0.2.3"
syntect = { version = "5", optional = true, default-features = false, features = ["default-fancy"] }
ratatui-image = { version = "11.0.6", optional = true, default-features = false, features = ["crossterm"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
